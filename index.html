<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>情绪急救</title>
<script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>
<style>
  :root {
    --bg: #f5f7fa;
    --panel: #ffffff;
    --border: #e4e8ee;
    --text: #1f2937;
    --text-muted: #6b7280;
    --user: #d85a30;
    --user-text: #ffffff;
    --ai-bg: #ffffff;
    --ai-text: #1f2937;
    --sys-bg: #fff8e1;
    --sys-text: #92700f;
    --err-bg: #fde8e8;
    --err-text: #c0211d;
    --accent: #d85a30;
  }

  * { box-sizing: border-box; }

  html, body {
    margin: 0;
    padding: 0;
    height: 100%;
    background: var(--bg);
    color: var(--text);
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "PingFang SC",
      "Hiragino Sans GB", "Microsoft YaHei", sans-serif;
    font-size: 15px;
    line-height: 1.6;
  }

  .app {
    display: flex;
    flex-direction: column;
    height: 100vh;
    max-width: 900px;
    margin: 0 auto;
    background: var(--panel);
    border-left: 1px solid var(--border);
    border-right: 1px solid var(--border);
  }

  header {
    padding: 16px 20px;
    border-bottom: 1px solid var(--border);
    display: flex;
    align-items: center;
    justify-content: space-between;
    background: var(--panel);
    flex-shrink: 0;
  }

  header .title {
    display: flex;
    align-items: center;
    gap: 10px;
  }

  header .avatar {
    width: 36px;
    height: 36px;
    border-radius: 50%;
    background: linear-gradient(135deg, #f0997b, #d85a30);
    color: #fff;
    display: flex;
    align-items: center;
    justify-content: center;
    font-weight: 600;
    font-size: 16px;
  }

  header h1 {
    font-size: 16px;
    margin: 0;
    font-weight: 600;
  }

  header .subtitle {
    font-size: 12px;
    color: var(--text-muted);
    margin-top: 2px;
  }

  header .actions {
    display: flex;
    gap: 8px;
  }

  button.btn {
    border: 1px solid var(--border);
    background: var(--panel);
    color: var(--text);
    padding: 6px 12px;
    border-radius: 6px;
    cursor: pointer;
    font-size: 13px;
    transition: all 0.15s;
  }

  button.btn:hover {
    background: #f0f2f5;
  }

  button.btn.primary {
    background: var(--accent);
    color: #fff;
    border-color: var(--accent);
  }

  button.btn.primary:hover {
    background: #c14a22;
  }

  button.btn:disabled {
    opacity: 0.5;
    cursor: not-allowed;
  }

  .messages {
    flex: 1;
    overflow-y: auto;
    padding: 20px;
    display: flex;
    flex-direction: column;
    gap: 14px;
  }

  .msg {
    display: flex;
    gap: 10px;
    max-width: 100%;
  }

  .msg.user {
    flex-direction: row-reverse;
  }

  .msg .bubble {
    padding: 10px 14px;
    border-radius: 12px;
    max-width: 75%;
    word-wrap: break-word;
    word-break: break-word;
  }

  .msg.user .bubble {
    background: var(--user);
    color: var(--user-text);
    border-top-right-radius: 4px;
  }

  .msg.ai .bubble {
    background: var(--ai-bg);
    color: var(--ai-text);
    border: 1px solid var(--border);
    border-top-left-radius: 4px;
  }

  .bubble p { margin: 0 0 8px 0; }
  .bubble p:last-child { margin-bottom: 0; }
  .bubble pre {
    background: #f6f8fa;
    padding: 10px;
    border-radius: 6px;
    overflow-x: auto;
    font-size: 13px;
    margin: 8px 0;
  }
  .bubble code {
    font-family: "JetBrains Mono", "Consolas", "Courier New", monospace;
  }
  .bubble :not(pre) > code {
    background: rgba(216, 90, 48, 0.1);
    padding: 1px 5px;
    border-radius: 4px;
    font-size: 13px;
  }
  .msg.user .bubble code {
    background: rgba(255, 255, 255, 0.2);
  }
  .msg ul, .msg ol { margin: 6px 0; padding-left: 22px; }

  .system-card {
    align-self: stretch;
    background: var(--sys-bg);
    color: var(--sys-text);
    border: 1px solid #f5e6b8;
    border-radius: 8px;
    padding: 8px 12px;
    font-size: 13px;
    white-space: pre-wrap;
  }

  .system-card.error {
    background: var(--err-bg);
    color: var(--err-text);
    border-color: #f5c6c6;
  }

  .system-card .label {
    font-weight: 600;
    margin-right: 6px;
  }

  .typing {
    display: inline-flex;
    gap: 4px;
    align-items: center;
    padding: 2px 0;
  }

  .typing span {
    width: 6px;
    height: 6px;
    background: var(--text-muted);
    border-radius: 50%;
    animation: blink 1.4s infinite both;
  }

  .typing span:nth-child(2) { animation-delay: 0.2s; }
  .typing span:nth-child(3) { animation-delay: 0.4s; }

  @keyframes blink {
    0%, 80%, 100% { opacity: 0.3; }
    40% { opacity: 1; }
  }

  footer {
    border-top: 1px solid var(--border);
    padding: 12px 16px;
    background: var(--panel);
    flex-shrink: 0;
  }

  .input-row {
    display: flex;
    gap: 8px;
    align-items: flex-end;
  }

  textarea#input {
    flex: 1;
    resize: none;
    border: 1px solid var(--border);
    border-radius: 8px;
    padding: 10px 12px;
    font-family: inherit;
    font-size: 15px;
    line-height: 1.5;
    max-height: 140px;
    min-height: 44px;
    outline: none;
    transition: border-color 0.15s;
    background: #fff;
    color: var(--text);
  }

  textarea#input:focus {
    border-color: var(--accent);
  }

  .hint {
    font-size: 12px;
    color: var(--text-muted);
    margin-top: 6px;
    text-align: center;
  }
</style>
</head>
<body>
<div class="app">
  <header>
    <div class="title">
      <div class="avatar">心</div>
      <div>
        <h1>情绪急救</h1>
        <div class="subtitle">Cloudflare Pages · DeepSeek</div>
      </div>
    </div>
    <div class="actions">
      <button class="btn" id="newBtn">新对话</button>
    </div>
  </header>

  <div class="messages" id="messages">
    <div class="system-card">
      <span class="label">系统:</span>已连接情绪急救助手。说说你遇到的事，我陪你聊聊。点"新对话"重置上下文。
    </div>
  </div>

  <footer>
    <div class="input-row">
      <textarea id="input" placeholder="说说你遇到了什么事…（Enter 发送，Shift+Enter 换行）" rows="1"></textarea>
      <button class="btn primary" id="sendBtn">发送</button>
    </div>
    <div class="hint">由 Cloudflare Pages 托管 · DeepSeek 提供推理 · 不是医疗建议</div>
  </footer>
</div>

<script>
  const messagesEl = document.getElementById("messages");
  const inputEl = document.getElementById("input");
  const sendBtn = document.getElementById("sendBtn");
  const newBtn = document.getElementById("newBtn");

  let history = [];
  let sending = false;
  let pendingAI = null;
  let pendingAIContent = "";

  marked.setOptions({ breaks: true, gfm: true });

  function escapeHtml(s) {
    return s.replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;");
  }

  function scrollToBottom() {
    messagesEl.scrollTop = messagesEl.scrollHeight;
  }

  function addMessage(role, html) {
    const wrap = document.createElement("div");
    wrap.className = "msg " + role;
    const bubble = document.createElement("div");
    bubble.className = "bubble";
    bubble.innerHTML = html;
    wrap.appendChild(bubble);
    messagesEl.appendChild(wrap);
    scrollToBottom();
    return bubble;
  }

  function addSystemCard(kind, label, text) {
    const card = document.createElement("div");
    card.className = "system-card " + kind;
    const labelEl = document.createElement("span");
    labelEl.className = "label";
    labelEl.textContent = label;
    card.appendChild(labelEl);
    card.appendChild(document.createTextNode(text));
    messagesEl.appendChild(card);
    scrollToBottom();
  }

  function startAIBubble() {
    pendingAIContent = "";
    const wrap = document.createElement("div");
    wrap.className = "msg ai";
    const bubble = document.createElement("div");
    bubble.className = "bubble";
    bubble.innerHTML = '<div class="typing"><span></span><span></span><span></span></div>';
    wrap.appendChild(bubble);
    messagesEl.appendChild(wrap);
    scrollToBottom();
    pendingAI = bubble;
  }

  function appendDelta(delta) {
    if (!pendingAI) return;
    pendingAIContent += delta;
    pendingAI.innerHTML = marked.parse(stripFinishPrefix(pendingAIContent));
    scrollToBottom();
  }

  function stripFinishPrefix(text) {
    return text.replace(/^完成:/, "").trimStart();
  }

  function finalizeAIBubble() {
    if (!pendingAI) return;
    if (!pendingAIContent) {
      pendingAI.innerHTML = '<span style="color:#999">（无内容）</span>';
    } else {
      pendingAI.innerHTML = marked.parse(stripFinishPrefix(pendingAIContent));
    }
    pendingAI = null;
    pendingAIContent = "";
  }

  function setSending(v) {
    sending = v;
    sendBtn.disabled = v;
    inputEl.disabled = v;
    if (!v) inputEl.focus();
  }

  async function send() {
    const text = inputEl.value.trim();
    if (!text || sending) return;

    addMessage("user", escapeHtml(text).replace(/\n/g, "<br>"));
    history.push({ role: "user", content: text });
    inputEl.value = "";
    autoGrow();

    setSending(true);
    startAIBubble();

    try {
      const resp = await fetch("/api/chat", {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify({
          messages: history.filter((m) => m.role !== "user" || m.content !== text),
          input: text,
        }),
      });

      if (!resp.ok) {
        const errText = await resp.text();
        finalizeAIBubble();
        addSystemCard("error", "错误:", `HTTP ${resp.status}: ${errText}`);
        return;
      }

      const reader = resp.body.getReader();
      const decoder = new TextDecoder("utf-8");
      let buffer = "";

      while (true) {
        const { done, value } = await reader.read();
        if (done) break;
        buffer += decoder.decode(value, { stream: true });

        const lines = buffer.split("\n");
        buffer = lines.pop();

        for (const line of lines) {
          const trimmed = line.trim();
          if (!trimmed.startsWith("data:")) continue;
          const payload = trimmed.slice(5).trim();
          if (!payload || payload === "[DONE]") continue;
          try {
            const evt = JSON.parse(payload);
            const delta = evt.choices?.[0]?.delta?.content;
            if (delta) appendDelta(delta);
          } catch {}
        }
      }
    } catch (e) {
      finalizeAIBubble();
      addSystemCard("error", "错误:", "连接失败: " + e.message);
    } finally {
      finalizeAIBubble();
      if (pendingAIContent) {
        history.push({ role: "assistant", content: pendingAIContent });
      }
      setSending(false);
    }
  }

  function autoGrow() {
    inputEl.style.height = "auto";
    inputEl.style.height = Math.min(inputEl.scrollHeight, 140) + "px";
  }

  sendBtn.addEventListener("click", send);
  inputEl.addEventListener("keydown", (e) => {
    if (e.key === "Enter" && !e.shiftKey) {
      e.preventDefault();
      send();
    }
  });
  inputEl.addEventListener("input", autoGrow);

  newBtn.addEventListener("click", () => {
    if (sending) return;
    history = [];
    messagesEl.innerHTML = "";
    const card = document.createElement("div");
    card.className = "system-card";
    const label = document.createElement("span");
    label.className = "label";
    label.textContent = "系统:";
    card.appendChild(label);
    card.appendChild(document.createTextNode("已开启新对话。"));
    messagesEl.appendChild(card);
    inputEl.focus();
  });

  inputEl.focus();
</script>
</body>
</html>
